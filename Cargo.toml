[package]
name = "lolzBuyTgSessions"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
dotenvy = "0.15.7"
ferogram = { version = "0.6", features = ["serde"] }
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
